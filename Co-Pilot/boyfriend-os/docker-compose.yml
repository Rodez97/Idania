version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: boyfriend-os-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: boyfriend
      POSTGRES_PASSWORD: boyfriend
      POSTGRES_DB: boyfriend_os
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
